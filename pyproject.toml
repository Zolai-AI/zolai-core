[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zolai"
version = "2.0.0"
description = "Unified Zolai language toolkit — crawl, clean, analyze, train, translate"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Peter", email = "peterpausianlian@gmail.com"},
]
keywords = ["zolai", "tedim", "chin", "language", "nlp", "llm", "translation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# Base = CPU-light core (no torch). Works on machines without an NVIDIA GPU.
# ML extras: [ml] CPU embeddings/transformers, [gpu] CUDA training stack.
dependencies = [
    # Core
    "fastapi>=0.142.2",
    "uvicorn>=0.34.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "aiofiles>=23.2",
    "pyyaml>=6.0",
    "pydantic>=2.13.5",
    "jinja2>=3.1",
    # Web/Crawler
    "ddgs>=9.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    # Database
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9",
    "orjson>=3.9",
    # Metrics (Prometheus exposition — pinned, exporter output must be stable)
    "prometheus-client==0.26.0",
    # Data processing
    "pandas>=2.3.0",
    "numpy>=2.5.3,<3",
    "scikit-learn>=1.9.0,<1.10",
    "sklearn-crfsuite>=0.5.0",
    # Tokenizer (BPE — no torch needed)
    "sentencepiece>=0.2.2",
    # Visualization
    "matplotlib>=3.5",
    "tqdm>=4.66",
    # Kaggle
    "kaggle>=1.6.0",
    "kagglehub>=0.3",
    # <2 cap: transformers 5.17 / sentence-transformers 6.1 / tokenizers require <2;
    # revisit when transformers declares >=2
    "huggingface_hub>=1.33.0,<2",
    # OCR
    "mistralai>=1.0",
]

[project.optional-dependencies]
# CPU ML stack: embeddings + transformer inference (install via scripts/install.sh
# which picks the CPU or CUDA torch wheel automatically)
ml = [
    "torch>=2.14.0",
    "transformers>=5.16.1,<6",
    "sentence-transformers>=6.0.0,<7",
    "datasets>=4.8",
]
# GPU/CUDA training stack (requires NVIDIA GPU + CUDA driver).
# torch is resolved from the cu130 index by scripts/install.sh.
gpu = [
    "zolai[ml]",
    "bitsandbytes>=0.50.2,<0.51",
    "accelerate>=1.15.0",
    "peft>=0.20.0",
    "trl>=0.20.0",
    "scipy>=1.10",
]
gui = [
    "pygobject>=3.48",  # GTK3 bindings (may require system install: apt install python3-gi gir1.2-gtk-3.0)
]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "mypy>=1.8",
]
# Desktop sidecar: slim deps for Tauri integration (no ML/torch)
desktop = [
    "fastapi>=0.142.2",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "rich>=13.7",
    "typer>=0.12",
]
# Gemini WebAPI: browser cookie auth for free Gemini access
webapi = [
    "gemini-webapi>=0.1",
    "browser-cookie3>=0.1",
]
# Server mode: desktop + full zolai-core (all deps)
server = [
    "zolai[desktop]",
    "zolai[webapi]",
]
# Full with GPU support (gpu includes ml)
full = [
    "zolai[gui]",
    "zolai[dev]",
    "zolai[gpu]",
]

[project.scripts]
zolai = "zolai.cli.main:main"
zolai-zvs = "zolai.zvs.cli:main"
zolai-eval = "zolai.eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    "__pycache__",
    ".venv",
    "venv",
    "/data",
    "runs",
    # One-off scripts with broken syntax (mismatched quotes) — not worth fixing
    "scripts/data_pipeline/combine_training_sources.py",
    "scripts/data_pipeline/consolidate_all_training.py",
    "scripts/data_pipeline/extract_training_versions.py",
    "scripts/data_pipeline/fix_batch_9.py",
    "scripts/data_pipeline/fix_batch_zvs.py",
    "scripts/data_pipeline/merge_final_dataset.py",
    "scripts/data_pipeline/process_zolai_batch.py",
    "scripts/data_pipeline/unify_all_corpus.py",
    "scripts/dev/fix_zolai.py",
    "scripts/dictionary/process_dictionary_batch.py",
    "scripts/dictionary/process_dictionary_batch_v2.py",
    "scripts/cleaner/clean_master_dataset.py",
    "scripts/cleaner/dedupe_corpus_master.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E701", "E702", "E722", "E501", "W291", "W292", "W293", "E402", "F401", "F403", "F405", "F811", "F821", "F601", "E741", "E711", "I001"]
"docs/**" = ["E701", "E702", "E722", "E501", "W291", "W292", "W293", "E402"]
"config/**" = ["E701", "E702", "E722", "E501", "W291", "W292", "W293", "E402"]
"run_api.py" = ["E701", "E702", "E722", "E501"]
# Large literal dictionaries / bilingual gloss tables — keep keys readable; last-wins intentional
"zolai/syllable/segmenter.py" = ["E501", "F601"]
# Long user-facing strings and defensive catch-alls in desktop/API glue
"zolai/api/comprehensive_analyzer.py" = ["E501", "E722"]
"zolai/api/desktop_router.py" = ["E501", "E722"]
"zolai/core/jsonl_pipeline.py" = ["E501"]
"zolai/core/jsonl_pipeline_v2.py" = ["E501"]
"zolai/core/jsonl_pipeline_v3.py" = ["E501"]
"zolai/llm/providers/webapi.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
