# ZolaiBench v0.1 — Evaluation Smoke Tests
# Runs on PR/push. In CI it scores the bundled smoke set (ZVS compliance,
# translation BLEU/chrF, QA term recall) against report/eval-baseline.json;
# the gold-backed tasks (tokenization, POS, morphology, grammar) need the
# gitignored data/eval corpus and are smoke-tested locally.

name: ZolaiBench Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-smoke:
    name: ZolaiBench Smoke (bundled set vs floors)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .  # installs base + sklearn-crfsuite
          pip install pytest ruff

      - name: Run ZolaiBench smoke tests
        run: |
          # The bundled `smoke` set scores every lane that has data in a fresh
          # checkout. POS / morphology / grammar gold lives in the gitignored
          # data/eval/*_gold_v0.jsonl corpus, so those tasks report "No gold
          # data" here and are scored locally with `zolai eval run all --smoke`.
          python -m zolai.eval.cli --set smoke --json \
            --baseline report/eval-baseline.json --gate > smoke_results.json
          cat smoke_results.json

      - name: Check for failures
        run: |
          # --gate already exits 1 on a regression; this re-reads the artifact so
          # the reason lands in the log, not only in the exit code.
          python - <<'PY'
          import json, sys
          with open("smoke_results.json") as f:
              report = json.load(f)
          metrics = report["metrics"]
          floors = report.get("floors", {})
          below = report.get("below_floor", [])
          if below:
              print("❌ Smoke gate FAILED")
              for name in below:
                  print(f"  {name}: {metrics[name]:.4f} < floor {floors[name]:.4f}")
              sys.exit(1)
          print("✅ All smoke metrics above floor")
          for name in sorted(metrics):
              print(f"  {name}: {metrics[name]:.4f} (floor {floors.get(name, 0.0):.4f})")
          PY

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zolaibench-smoke-results
          path: smoke_results.json
          retention-days: 7

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check zolai tests

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install mypy
      - run: mypy zolai/eval --ignore-missing-imports