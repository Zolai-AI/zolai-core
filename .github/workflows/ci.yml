name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff pytest
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check zolai/

      - name: Test
        run: pytest tests/ -q

      - name: ZVS scan (report-only)
        run: python scripts/zvs/scan_content.py --wiki
        continue-on-error: true

      - name: Upload ZVS scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zvs-scan-report
          path: report/zvs-scan*

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t zolai-core .
