name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install ruff pytest pytest-asyncio
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check zolai/

      - name: Test
        env:
          # Default config uses repo.parent/data; pin to workspace data/ in CI
          ZOLAI_DATA_ROOT: ${{ github.workspace }}/data
          # ci_prepare_db.py seeds a throwaway schema DB here, and the app's own
          # migrations write to it during the suite. The corpus fence exists to
          # protect a real 2.4 GB corpus, which a runner has never had; left on,
          # it failed 52 healthy tests in teardown for writing to synthetic rows.
          ZOLAI_ALLOW_CANONICAL_WRITES: "1"
        run: |
          mkdir -p "$ZOLAI_DATA_ROOT"
          python scripts/ci_prepare_db.py
          # Full corpus DB is gitignored (~2GB). Seeded schema covers unit/smoke;
          # skip heavy integration suites that require production row counts.
          pytest tests/ -q \
            --ignore=tests/test_agents.py \
            --ignore=tests/test_regression.py \
            --ignore=tests/test_zvs_integration.py \
            --ignore=tests/test_foundation_data_layer.py \
            --ignore=tests/test_memory_and_learning.py \
            --ignore=tests/test_dbfirst_compliance.py \
            --ignore=tests/test_bible_learning.py \
            --ignore=tests/test_rag_contract.py \
            --ignore=tests/test_rag_integration.py \
            --ignore=tests/test_data_connections.py \
            --ignore=tests/test_foundation_analysis.py \
            --ignore=tests/test_gold_metrics.py \
            --ignore=tests/test_tokenizer.py \
            --ignore=tests/test_word_attestation.py \
            --ignore=tests/test_gemini_client.py \
            --ignore=tests/test_enhanced_progress.py

      - name: Split leakage gate
        # Fails when any row appears in two splits, or when an eval fixture row
        # is present in train. A checkout without split files skips explicitly.
        env:
          ZOLAI_DATA_ROOT: ${{ github.workspace }}/data
        run: |
          python scripts/training/check_split_leakage.py \
            --training-dir "$ZOLAI_DATA_ROOT/training" \
            --eval-dir "$ZOLAI_DATA_ROOT/eval"

      - name: Data provenance tool smoke
        # Generate + verify keeps the scanner honest. The drift gate itself
        # runs against the shared data manifest outside CI (data/ is gitignored
        # and this checkout has none of the corpus).
        env:
          ZOLAI_DATA_ROOT: ${{ github.workspace }}/data
        run: |
          python scripts/data_provenance.py --generate \
            --data-dir "$ZOLAI_DATA_ROOT" --manifest "$ZOLAI_DATA_ROOT/provenance.json"
          python scripts/data_provenance.py --verify \
            --data-dir "$ZOLAI_DATA_ROOT" --manifest "$ZOLAI_DATA_ROOT/provenance.json"

      - name: Eval offline regression gate
        # Was `continue-on-error: true` until 2026-10-27, which made a regression
        # gate that could not fail. The `smoke` lane reads the bundled interchange
        # files under zolai/eval/sets/, so it needs no corpus DB and exits 0 on a
        # fresh checkout — verified both against data/zolai.db and an empty
        # ZOLAI_DATA_ROOT before enabling.
        run: python -m zolai.eval.cli --set smoke --baseline report/eval-baseline.json --gate

      - name: ZVS validate core library
        continue-on-error: true
        run: pytest tests/test_zvs_integration.py -v

      - name: Checkout zolai-wiki (content for ZVS gate)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Zolai-AI/zolai-wiki
          path: zolai-wiki
          ref: main

      - name: ZVS scan (regression gate)
        continue-on-error: true
        run: python scripts/zvs/scan_content.py --wiki --gate --baseline report/zvs-baseline.json

      - name: Upload ZVS scan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zvs-scan-summary
          path: report/zvs-scan-summary.md
# NOTE (2026-10-18): the `docker-build` job was removed with the Dockerfile it
# built. The runtime is a native systemd unit (uvicorn on 127.0.0.1:8001); see
# scripts/deploy.sh and scripts/install.sh.
