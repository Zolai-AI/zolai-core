# Prometheus scrape + rule configuration for the zolai-monitoring stack.
# Mounted read-only at /etc/prometheus/prometheus.yml.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: zolai-monitoring

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # The API and Prometheus both run natively on the host, so the target is
  # plain loopback. (It used to be `host.docker.internal:8000` + a `host-gateway`
  # extra_host, because a container cannot reach the host's loopback. The
  # containerised stack was retired 2026-10-18 — see docs/MONITORING.md §1.)
  - job_name: zolai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          instance: zolai-api
