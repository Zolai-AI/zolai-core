# Prometheus scrape + rule configuration for the zolai-monitoring stack.
# Mounted read-only at /etc/prometheus/prometheus.yml.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: zolai-monitoring

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # The API runs on the host; Linux resolves host.docker.internal through the
  # `host-gateway` extra_host declared in docker-compose.monitoring.yml.
  - job_name: zolai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          instance: zolai-api
