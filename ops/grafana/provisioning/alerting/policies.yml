# Grafana notification policies (unified alerting provisioning).
#
# Routes every firing alert to the `zolai-ops` contact point; critical
# severity repeats more often than warnings.

apiVersion: 1

policies:
  - orgId: 1
    receiver: zolai-ops
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: zolai-ops
        object_matchers:
          - - severity
            - "="
            - critical
        group_wait: 30s
        repeat_interval: 4h
      - receiver: zolai-ops
        object_matchers:
          - - severity
            - "="
            - warning
        group_wait: 2m
        repeat_interval: 24h
